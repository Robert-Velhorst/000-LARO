name: Exception privacy boundaries
on:
  pull_request:
    paths:
      - graphql_bridge.py
      - serverless_architecture.py
      - serverless_functions.py
      - test_exception_privacy_boundary.py
      - .github/scripts/exception_privacy_proof.py
      - .github/workflows/exception-privacy.yml
permissions:
  contents: read
jobs:
  exception-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Resolve and install the current stable Flask and Requests graph with hashes
        run: |
          mkdir -p EXCEPTION_PRIVACY_EVIDENCE
          printf 'Flask==3.1.3\nrequests==2.34.2\n' > EXCEPTION_PRIVACY_EVIDENCE/sdk.in
          uv venv --python 3.15.2 .venv
          uv pip compile --python-version 3.15.2 --prerelease=disallow --generate-hashes EXCEPTION_PRIVACY_EVIDENCE/sdk.in -o EXCEPTION_PRIVACY_EVIDENCE/sdk.lock
          uv pip install --python .venv/bin/python --require-hashes -r EXCEPTION_PRIVACY_EVIDENCE/sdk.lock
          uv pip check --python .venv/bin/python
      - name: Run identical original and patched response log and metric privacy cases
        run: .venv/bin/python -B -I .github/scripts/exception_privacy_proof.py
      - name: Audit the complete frozen Flask and Requests dependency graph without exclusions
        run: uvx --from pip-audit==2.10.1 pip-audit -r EXCEPTION_PRIVACY_EVIDENCE/sdk.lock --no-deps --disable-pip --strict --format json --output EXCEPTION_PRIVACY_EVIDENCE/sdk-audit.json
      - name: Retain all source identities, cases, lock and raw audit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: exception-privacy-proof
          path: EXCEPTION_PRIVACY_EVIDENCE
          if-no-files-found: error
          retention-days: 14
