name: Security analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
      - name: Analyze source
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan commits and pull-request changes for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the runtime image
        run: docker build -t laro-security:${{ github.sha }} .
      - name: Generate CycloneDX software inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: laro-security:${{ github.sha }}
          format: cyclonedx
          output: out/security/laro-sbom.cdx.json
      - name: Reject unaccepted high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: laro-security:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
      - name: Upload the software inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LARO-Container-SBOM
          path: out/security/laro-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30

  record-scheduled-failure:
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    needs: [codeql, secret-scan, container-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Open or update the security-scan failure record
        run: node scripts/upsert-automation-failure.mjs "[maintenance] Security scans require attention" "scheduled security analysis"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
