name: Security analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze source
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan commits and pull-request changes for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_VERSION: 8.24.3
      - name: Scan the checked-out tree for merge-result secrets
        run: gitleaks dir --redact --verbose --exit-code 2 .

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the runtime image
        run: |
          mkdir -p out/security
          docker build --pull -t laro-security:${{ github.sha }} .
      - name: Generate CycloneDX software inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: laro-security:${{ github.sha }}
          scanners: vuln
          format: cyclonedx
          output: out/security/laro-sbom.cdx.json
          exit-code: '0'
          list-all-pkgs: true
          hide-progress: true
          timeout: 10m
      - name: Reject unaccepted high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: laro-security:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          hide-progress: true
          timeout: 10m
          skip-setup-trivy: true
      - name: Upload the software inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LARO-Container-SBOM
          path: out/security/laro-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30

  record-scheduled-failure:
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    needs: [codeql, secret-scan, container-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update the security-scan failure record
        run: node scripts/upsert-automation-failure.mjs "[maintenance] Security scans require attention" "scheduled security analysis"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
