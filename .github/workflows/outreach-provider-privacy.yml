name: Outreach provider exception privacy
on:
  pull_request:
    paths:
      - outreach_discovery.py
      - dutch_legal_taxonomy.py
      - test_outreach_discovery.py
      - test_outreach_provider_privacy_boundary.py
      - .github/scripts/outreach_provider_privacy_proof.py
      - .github/workflows/outreach-provider-privacy.yml
permissions:
  contents: read
jobs:
  outreach-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Resolve and install the current stable Requests and BeautifulSoup graph with hashes
        run: |
          mkdir -p OUTREACH_PROVIDER_PRIVACY_EVIDENCE
          printf 'requests==2.34.2\nbeautifulsoup4==4.15.0\n' > OUTREACH_PROVIDER_PRIVACY_EVIDENCE/sdk.in
          uv venv --python 3.15.2 .venv
          uv pip compile --python-version 3.15.2 --prerelease=disallow --generate-hashes OUTREACH_PROVIDER_PRIVACY_EVIDENCE/sdk.in -o OUTREACH_PROVIDER_PRIVACY_EVIDENCE/sdk.lock
          uv pip install --python .venv/bin/python --require-hashes -r OUTREACH_PROVIDER_PRIVACY_EVIDENCE/sdk.lock
          uv pip check --python .venv/bin/python
      - name: Compare identical original and patched provider exception privacy cases
        run: .venv/bin/python -B -I .github/scripts/outreach_provider_privacy_proof.py
      - name: Audit the complete frozen Requests and BeautifulSoup dependency graph without exclusions
        run: uvx --from pip-audit==2.10.1 pip-audit -r OUTREACH_PROVIDER_PRIVACY_EVIDENCE/sdk.lock --no-deps --disable-pip --strict --format json --output OUTREACH_PROVIDER_PRIVACY_EVIDENCE/sdk-audit.json
      - name: Retain all source identities, cases, lock and raw audit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: outreach-provider-privacy-proof
          path: OUTREACH_PROVIDER_PRIVACY_EVIDENCE
          if-no-files-found: error
          retention-days: 14
