name: Scheduled maintenance

on:
  schedule:
    - cron: '17 5 * * 1' # Weekly, Monday 05:17 UTC.
    - cron: '43 5 1 * *' # Monthly, first day at 05:43 UTC.
  workflow_dispatch:
    inputs:
      cadence:
        description: Checks to run
        required: true
        default: monthly
        type: choice
        options:
          - weekly
          - monthly

permissions:
  contents: read
  issues: write

jobs:
  safe-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run weekly repository-safe checks
        run: npm run gate
      - name: Run monthly data-readiness check against disposable test data
        if: github.event.schedule == '43 5 1 * *' || github.event.inputs.cadence == 'monthly'
        run: npm run db:readiness
        env:
          DATABASE_URL: ${{ runner.temp }}/laro-maintenance.sqlite
      - name: Record a visible scheduled-maintenance failure
        if: failure() && github.event_name == 'schedule'
        run: node scripts/upsert-automation-failure.mjs "[maintenance] Scheduled checks require attention" "scheduled maintenance"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
